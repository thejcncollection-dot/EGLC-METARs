name: EGLC Weather Watch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: EGLC-METARs-JCN-VRG-5577
    steps:
      - uses: actions/checkout@v4

      - name: Check METAR and TAF
        run: |
          check_report() {
            TYPE=$1
            LABEL=$2
            STATEFILE="data/last_${TYPE}.txt"

            CURRENT=$(curl -s -H "Accept: text/plain" \
              "https://aviationweather.gov/api/data/${TYPE}?ids=EGLC&format=raw")

            LAST=""
            if [ -f "$STATEFILE" ]; then
              LAST=$(cat "$STATEFILE")
            fi

            if [ "$CURRENT" != "$LAST" ] && [ -n "$CURRENT" ]; then
              if [ -n "$LAST" ]; then
                curl -s -d "$CURRENT" -H "Title: $LABEL" "https://ntfy.sh/$NTFY_TOPIC"
              fi
              echo "$CURRENT" > "$STATEFILE"
              git add "$STATEFILE"
            fi
          }

          mkdir -p data
          check_report "metar" "EGLC METAR"
          check_report "taf" "EGLC TAF"

          if ! git diff --cached --quiet; then
            git config user.name "metar-bot"
            git config user.email "actions@github.com"
            git commit -m "Update last reports"
            git push
          fi
