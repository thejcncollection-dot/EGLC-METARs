name: EGLC METAR Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-metar:
    runs-on: ubuntu-latest
    env:
      CHECKWX_API_KEY: ${{ secrets.CHECKWX_API_KEY }}
      NTFY_TOPIC: EGLC-METARs-JCN-VRG-5577
    steps:
      - uses: actions/checkout@v4

      - name: Poll twice within this run
        run: |
          for i in 1 2; do
            mkdir -p data
            curl -s -H "X-API-Key: $CHECKWX_API_KEY" \
              "https://api.checkwx.com/v2/metar/EGLC" -o response.json

            CURRENT=$(python3 -c "import json; d=json.load(open('response.json')); print(d['data'][0].strip() if d.get('data') else '')")

            LAST=""
            if [ -f data/last.txt ]; then
              LAST=$(cat data/last.txt)
            fi

            if [ "$CURRENT" != "$LAST" ] && [ -n "$CURRENT" ]; then
              if [ -n "$LAST" ]; then
                curl -s -d "$CURRENT" -H "Title: EGLC METAR" "https://ntfy.sh/$NTFY_TOPIC"
              fi
              echo "$CURRENT" > data/last.txt
              git config user.name "metar-bot"
              git config user.email "actions@github.com"
              git add data/last.txt
              git commit -m "Update last METAR" || echo "no change to commit"
              git push
            fi

            if [ $i -eq 1 ]; then
              sleep 150
            fi
          done
